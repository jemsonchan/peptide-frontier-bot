name: autorespond · tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-autorespond.txt pytest pytest-cov
      - run: PYTHONPATH=src:. pytest -q --cov=pf_autorespond --cov-report=term-missing
